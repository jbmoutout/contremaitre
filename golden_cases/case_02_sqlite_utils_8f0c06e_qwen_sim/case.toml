# Case 02 — sqlite-utils @ 8f0c06e, Qwen SIM (cross-family)
#
# Same target + base SHA as case_01. Differs only on `sim_model`: Qwen 3.6+
# via OpenRouter instead of deepseek-v4-flash-free. Tests two hypotheses
# the case_01 post-prompt regression surfaced:
#
#   1. Same-family agent ↔ SIM bias: case_01 had agent=deepseek and
#      SIM=deepseek, so the SIM was lenient on agent outputs in a way
#      cross-family review (codex) caught at publish time. A different-
#      family SIM should grill more independently.
#   2. SIM model strength: deepseek-v4-flash-free is a small model; the
#      SIM role's discipline (grilling, drift-watching) may exceed its
#      capability. Qwen 3.6-plus is a meaningfully more capable model.
#
# Reuses case_01's `eval/case-1` branch on the target repo — same input
# tuple, same base_sha guard. case_01's baseline remains the canonical
# deepseek-SIM reference; case_02 grows its own baseline once 3-of-3
# runs land clean. Direct cell-to-cell comparison across cases is a
# manual operator task today; a future `eval diff <case_a> <case_b>`
# subcommand could automate it.

id = "case_02_sqlite_utils_8f0c06e_qwen_sim"
description = "sqlite-utils @ 8f0c06e — cross-family Qwen SIM, codex review; same agent + target as case_01."

target_url = "git@github.com:jbmoutout/sqlite-utils.git"
base = "eval/case-1"
expected_base_sha = "8f0c06e1889513ed0f01cb57783ddf07c442d4be"

publish_mode = "gh"

[models]
agent_model = "opencode/deepseek-v4-flash-free"
sim_model = "openrouter/qwen/qwen3.6-plus"
cli_reviewer = "codex"
