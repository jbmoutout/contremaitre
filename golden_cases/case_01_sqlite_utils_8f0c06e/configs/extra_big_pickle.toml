# extra_big_pickle config — default + big-pickle SIM
#
# Same as `default` (deepseek agent, deepseek SIM, codex cli_reviewer)
# but uses opencode/big-pickle as the primary SIM instead. Retained as
# a named config for historical eval comparisons; the extra_reviewer
# feature it previously tested has been replaced by the cli_reviewer
# post-PR revision loop.

publish_mode = "gh"

[models]
agent_model = "opencode/deepseek-v4-flash-free"
sim_model = "opencode/big-pickle"
cli_reviewer = "codex"
