# Allowlist egress proxy for the CLI actor (ActorMode.CLI).
#
# Mounted at /etc/squid/squid.conf in the shared `contremaitre-egress-proxy`
# container by cli_egress.ensure_egress_proxy. Allows CONNECT only to the model
# providers' domains and denies everything else:
#   - .chatgpt.com / .openai.com  — codex (the CLI actor) on a ChatGPT account,
#   - .anthropic.com              — claude (the CLI actor) on a Claude subscription
#                                   (api + statsig/telemetry subdomains),
#   - .openrouter.ai              — an opencode SIM on a paid OpenRouter model,
#   - .opencode.ai / .models.dev  — an opencode SIM on a free OpenCode Zen model
#                                   (Zen API + the live model catalog).
# A mixed CLI-agent + opencode-SIM run shares this one proxy. These domains are
# not attacker-controllable, so they are not an exfil channel; an arbitrary host
# (collector, gist, ...) is denied, so the long-lived in-container token / the
# code cannot be POSTed out. NB: package registries (PyPI/npm/...) are NOT here —
# a run that needs to install deps must use --allow-open-egress.
http_port 3128
acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_dst dstdomain .chatgpt.com .openai.com .anthropic.com .openrouter.ai .opencode.ai .models.dev

# Only HTTPS CONNECT to 443, only to the allowlist; deny all else.
http_access deny CONNECT !SSL_ports
http_access allow allowed_dst
http_access deny all

# squid runs as the unprivileged 'proxy' user and cannot open /dev/stdout;
# log to its own writable dir (read via `docker exec ... cat`).
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache deny all
shutdown_lifetime 1 seconds
