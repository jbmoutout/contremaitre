[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contremaitre"
version = "0.2.0"
description = "Deterministic orchestration shell for architecture-agent PR runs."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Contremaitre"}]
dependencies = []

[project.optional-dependencies]
# Live TUI: `contremaitre tui run …` / `contremaitre tui attach <run-dir>`.
# Core CLI works without it.
tui = ["textual>=0.50"]

[project.scripts]
contremaitre = "contremaitre.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "rich>=13", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["contremaitre*"]

[tool.setuptools.package-data]
# scripts/*.py are real modules of the contremaitre.scripts package (it has an
# __init__.py), so setuptools collects them automatically — no package-data needed.
contremaitre = ["Dockerfile", "Dockerfile.*", "prompts/*.md", "*.conf"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".contremaitre"]

[tool.ruff.lint]
# Default (E4, E7, E9, F) + W (whitespace: trailing spaces, EOF newline, etc.).
# The W rules are what keep `git diff --check` from failing on PRs.
extend-select = ["W"]

[tool.coverage.run]
source = ["contremaitre"]
omit = [
    # Entry shim and standalone statusline scripts — run out-of-process, not
    # exercised by the suite. Their 0% is expected, not a gap.
    "contremaitre/__main__.py",
    "contremaitre/scripts/statusline.py",
    "contremaitre/scripts/statusline_meter.py",
    # Test scaffolding — a fake actor used by smoke cases, not product code.
    "contremaitre/fake_actor.py",
]

[tool.coverage.report]
show_missing = true

