[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contremaitre"
version = "0.1.1"
description = "Deterministic orchestration shell for architecture-agent PR runs."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}
authors = [{name = "Contremaitre"}]
dependencies = []

[project.optional-dependencies]
# Live TUI: `contremaitre tui run …` / `contremaitre tui attach <run-dir>`.
# Core CLI works without it.
tui = ["textual>=0.50"]

[project.scripts]
contremaitre = "contremaitre.cli:main"

[tool.setuptools.packages.find]
include = ["contremaitre*"]

[tool.setuptools.package-data]
contremaitre = ["Dockerfile", "prompts/*.md"]

