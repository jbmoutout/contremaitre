[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contremaitre"
version = "0.1.2"
description = "Deterministic orchestration shell for architecture-agent PR runs."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}
authors = [{name = "Contremaitre"}]
dependencies = []

[project.optional-dependencies]
# Live TUI: `contremaitre tui run …` / `contremaitre tui attach <run-dir>`.
# Core CLI works without it.
tui = ["textual>=0.50"]

[project.scripts]
contremaitre = "contremaitre.cli:main"

[dependency-groups]
dev = ["pytest>=8", "rich>=13", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["contremaitre*"]

[tool.setuptools.package-data]
contremaitre = ["Dockerfile", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".contremaitre"]

[tool.ruff.lint]
# Default (E4, E7, E9, F) + W (whitespace: trailing spaces, EOF newline, etc.).
# The W rules are what keep `git diff --check` from failing on PRs.
extend-select = ["W"]

